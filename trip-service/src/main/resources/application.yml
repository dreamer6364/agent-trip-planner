server:
  port: 8082

spring:
  application:
    name: trip-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:trip_planner}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 0
      retries: 0
      batch-size: 16384
      linger-ms: 5
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 1000
        delivery.timeout.ms: 2000
        request.timeout.ms: 1000
        connections.max.idle.ms: 1000
        metadata.max.age.ms: 1000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置 (用于权限评估)
jwt:
  public-key: ${JWT_PUBLIC_KEY}

# 限流配置
rate-limit:
  default-qps: 100
  trip-qps: 50

# Actuator & 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  version: 1.0.0

# 分享基础 URL
share:
  base-url: ${SHARE_BASE_URL:http://localhost:3000}

# Plan Service URL (用于 AI Agent 规划)
plan:
  service:
    url: ${PLAN_SERVICE_URL:http://localhost:8083}

# Auth Service URL (公开行程作者显示名查询)
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Feign 配置 (LLM 调用耗时较长，需加大超时)
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 180000
        loggerLevel: full
  compression:
    request:
      enabled: true
      mimeTypes: application/json
      min-request-size: 2048
    response:
      enabled: true

# 日志
logging:
  file:
    name: ${LOG_FILE:trip-service-app.log}
  level:
    com.tripplanner.trip: INFO
    com.tripplanner.trip.client: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.kafka: WARN
    webrix.feign: INFO
    com.tripplanner.plan: INFO
    org.apache.ibatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"