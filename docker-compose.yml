  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   networks:
  #     - trip-planner-network

  # auth-service, trip-service, plan-service, geo-service, planning-worker, notification-service
