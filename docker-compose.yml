  #     - gateway
  #   networks:
  #     - trip-planner-network

volumes:
  mysql_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  vm_data:
  jaeger_data:

networks:
  trip-planner-network:
    driver: bridge
    name: trip-planner-network